[project]
name = "network_qa"
version = "0.1.0"
description = "Quality-assurance metrics + decisions for the r01network pipeline (imported by network_fmri and other orchestrators)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nibabel>=5",
    "pandas",
    "network_events",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
network_events = { git = "https://github.com/lobennett/network_events.git", rev = "21dadcf" }

[project.scripts]
network-qa = "network_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
